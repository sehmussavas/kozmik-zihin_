<style>
  #kz-app{
    position:fixed; top:0; left:0; right:0; bottom:0; z-index:2147483000;
    overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
    color:#f3f1fd; font-family:'Inter',sans-serif; line-height:1.5; text-align:left;
    background:
      radial-gradient(1100px 600px at 12% -8%, #241a5c 0%, transparent 60%),
      radial-gradient(900px 500px at 108% 8%, #12234a 0%, transparent 55%),
      linear-gradient(180deg, #0a0e27 0%, #0d0a2a 45%, #120b33 100%);
  }
  #kz-app *{box-sizing:border-box;}
  #kz-app ::selection{background:rgba(157,124,245,0.35);}
  #kz-app textarea, #kz-app input, #kz-app button, #kz-app select{font-family:inherit;}
  #kz-app button{cursor:pointer;}
  #kz-app ::-webkit-scrollbar{width:10px;height:10px;}
  #kz-app ::-webkit-scrollbar-track{background:transparent;}
  #kz-app ::-webkit-scrollbar-thumb{background:rgba(167,139,250,0.3);border-radius:8px;}
  #kz-app .kz-display{font-family:'Space Grotesk',sans-serif;}
  #kz-app .katex{font-size:1.02em;}
  #kz-app .kz-stars-bg{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.55;
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 140px 90px, #fff, transparent),
      radial-gradient(1px 1px at 90px 170px, #cbd, transparent),
      radial-gradient(1px 1px at 250px 60px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 320px 210px, #fff, transparent),
      radial-gradient(1px 1px at 190px 260px, #cbd, transparent),
      radial-gradient(1.5px 1.5px at 60px 240px, #fff, transparent);

  }
  #kz-app .kz-scroll-x{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px;}
  #kz-app .kz-scroll-x::-webkit-scrollbar{height:5px;}
  #kz-app .kz-card{transition:border-color .2s, background .2s, transform .2s;}
  #kz-app .kz-card:hover{background:#171c3a !important; border-color:rgba(167,139,250,0.4) !important;}
  #kz-app .kz-fade{animation:kzFadeUp .35s ease both;}
  @media (max-width:640px){
    #kz-app .kz-hdr{flex-wrap:wrap; row-gap:10px;}
    #kz-app .kz-search{order:3; flex:1 1 100% !important;}
    #kz-app .kz-ask{margin-left:auto;}
  }
  @keyframes kzFadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

</style>
