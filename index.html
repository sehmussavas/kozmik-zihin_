/* ================= Yardımcı fonksiyonlar ================= */
function avgRatings(raterIds) {
  const vals = Object.values(raterIds || {});
  if (!vals.length) return 0;
  return vals.reduce((a,b)=>a+b,0) / vals.length;
}
function countRatings(raterIds) { return Object.keys(raterIds || {}).length; }
function bestAnswerId(q) {
  let best = null, bestAvg = 0;
  q.answers.forEach(a => {
    const n = countRatings(a.raterIds), avg = avgRatings(a.raterIds);
    if (n >= 3 && avg >= 4.5 && avg > bestAvg) { best = a.id; bestAvg = avg; }
  });
  return best;
}
function bestAnswerAvg(q) {
  return q.answers.reduce((max,a) => Math.max(max, avgRatings(a.raterIds)), 0);
}
function fmt(n) { return n.toLocaleString("tr-TR"); }
function timeAgo(dateStr) {
  const d = new Date(dateStr);
  const days = Math.max(0, Math.round((Date.now() - d.getTime()) / 86400000));
  if (days === 0) return "bugün";
  if (days === 1) return "dün";
  if (days < 30) return days + " gün önce";
  if (days < 365) return Math.round(days/30) + " ay önce";
  return Math.round(days/365) + " yıl önce";
}
function todayStr() { return new Date().toISOString().slice(0,10); }

function MathText({ text, style, className, block }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.renderMathInElement) {
      window.renderMathInElement(ref.current, {
        delimiters: [{ left:"$$", right:"$$", display:true }, { left:"$", right:"$", display:false }],
        throwOnError: false,
      });
    }
  }, [text]);
  const Tag = block ? "div" : "span";
  return <Tag ref={ref} className={className} style={{ whiteSpace:"pre-wrap", wordBreak:"break-word", ...style }}>{text}</Tag>;
}

/* ================= Küçük bileşenler ================= */
function CategoryIcon({ name, size = 14, style }) {
  const found = CATEGORIES.find(c => c.name === name);
  const Icon = found ? found.icon : Sparkles;
  return <Icon size={size} strokeWidth={2} style={style} />;
}

function BadgeChip({ name, size = "sm" }) {
  const style = BADGE_STYLES[name] || { color: T.purple };
  const pad = size === "sm" ? "2px 9px" : "4px 12px";
  const fs = size === "sm" ? 11 : 12.5;
  return (
    <span style={{
      display:"inline-flex", alignItems:"center", gap:4, padding:pad, borderRadius:999,
      fontSize:fs, fontWeight:600, color:style.color, background: style.color + "1a",
      border: "1px solid " + style.color + "45", whiteSpace:"nowrap",
    }}>
      <Award size={fs} /> {name}
    </span>
  );
}

function CosmicRing({ average = 0, size = 48, count }) {
  const pct = Math.max(0, Math.min(5, average)) / 5;
  const r = (size - 7) / 2, c = 2 * Math.PI * r, dash = c * pct;
  const gid = "kzGrad" + size + Math.round(average*10);
  return (
    <div style={{ position:"relative", width:size, height:size, flexShrink:0 }}
      title={count ? (average.toFixed(1) + " / 5 (" + count + " değerlendirme)") : "Henüz değerlendirme yok"}>
      <svg width={size} height={size} style={{ transform:"rotate(-90deg)" }}>
        <defs>
          <linearGradient id={gid} x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stopColor="#4fc3f7"/><stop offset="55%" stopColor="#9d7cf5"/><stop offset="100%" stopColor="#f4c05e"/>
          </linearGradient>
        </defs>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(167,139,250,0.16)" strokeWidth="4"/>
        {average > 0 && (
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={"url(#" + gid + ")"} strokeWidth="4"
            strokeLinecap="round" strokeDasharray={dash + " " + (c - dash)} />
        )}
      </svg>
      <div className="kz-display" style={{
        position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center",
        fontSize: size < 40 ? 11 : 13, fontWeight:700, color: average > 0 ? T.text : T.mutedDim,
      }}>
        {average > 0 ? average.toFixed(1) : "—"}
      </div>
    </div>
  );
}

function Stars({ value = 0, onRate, size = 18, readOnly }) {
  const [hover, setHover] = useState(0);
  const shown = hover || Math.round(value);
  return (
    <span style={{ display:"inline-flex", gap:2 }}>
      {[1,2,3,4,5].map(n => (
        <button key={n} type="button" disabled={readOnly}
          onMouseEnter={() => !readOnly && setHover(n)} onMouseLeave={() => setHover(0)}
          onClick={() => onRate && onRate(n)}
          aria-label={n + " yıldız"}
          style={{ background:"none", border:"none", padding:0, display:"flex", cursor: readOnly ? "default" : "pointer" }}>
          <Star size={size} color={n <= shown ? T.gold : T.mutedDim} style={{ fill: n <= shown ? T.gold : "none" }} />
        </button>
      ))}
    </span>
  );
}

function ListView({ questions, category, setCategory, sort, setSort, query, bookmarks, onOpen }) {
  const [sortOpen, setSortOpen] = useState(false);
  const filtered = useMemo(() => {
    const qq = query.trim().toLowerCase();
    let list = questions.filter(q => {
      if (category !== "Tümü" && q.category !== category) return false;
      if (!qq) return true;
      return (q.title + " " + q.body + " " + q.category + " " + q.tags.join(" ")).toLowerCase().includes(qq);
    });
    if (sort === "solved") list = list.filter(q => !!bestAnswerId(q));
    const score = {
      star: q => bestAnswerAvg(q),
      popular: q => q.views + q.bookmarks * 3 + q.answers.length * 5,
      new: q => new Date(q.date).getTime(),
      views: q => q.views,
      answers: q => q.answers.length,
      solved: q => bestAnswerAvg(q),
    }[sort];
    return [...list].sort((a,b) => score(b) - score(a));
  }, [questions, category, sort, query]);
  const cur = SORTS.find(s => s.key === sort);
  const CurIcon = cur.icon;

  return (
    <div>
      <div className="kz-scroll-x" style={{ marginBottom:14 }}>

      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14, position:"relative" }}>
        <span style={{ fontSize:13, color:T.muted }}>{filtered.length} soru</span>
        <button onClick={() => setSortOpen(o => !o)} style={{
          display:"inline-flex", alignItems:"center", gap:7, background:T.card, border:"1px solid " + T.border,
          color:T.text, borderRadius:10, padding:"7px 12px", fontSize:13,
        }}>
          <Filter size={14} color={T.purple}/> <CurIcon size={13}/> {cur.label} <ChevronDown size={14}/>
        </button>
        {sortOpen && (
          <div style={{ position:"absolute", right:0, top:"calc(100% + 6px)", zIndex:10, background:"#12162e",
            border:"1px solid " + T.borderHover, borderRadius:12, padding:6, minWidth:220, boxShadow:"0 12px 40px rgba(0,0,0,0.5)" }}>
            {SORTS.map(s => {
              const I = s.icon;
              return (
                <button key={s.key} onClick={() => { setSort(s.key); setSortOpen(false); }} style={{
                  width:"100%", display:"flex", alignItems:"center", gap:9, padding:"9px 12px", border:"none", borderRadius:8,
                  background: sort === s.key ? "rgba(157,124,245,0.18)" : "transparent",
                  color: sort === s.key ? T.text : T.muted, fontSize:13.5, textAlign:"left",
                }}><I size={14}/> {s.label}</button>

      <div style={{ display:"flex", flexDirection:"column", gap:12 }}>

function App() {
  const [questions, setQuestions] = useState(loadQuestions);
  const [bookmarks, setBookmarks] = useState(getBookmarks);
  const [view, setView] = useState({ name:"list" });
  const [query, setQuery] = useState("");
  const [category, setCategory] = useState("Tümü");
  const [sort, setSort] = useState("star");
  const myUid = useMemo(getUid, []);
  const scrollerRef = useRef(null);

  useEffect(() => { saveQuestions(questions); }, [questions]);

  // Sayfa kaydırmasını kilitle (tam ekran mod) ve Blogger'ın kaydırma çubuğunu gizle
  useEffect(() => {
    const prevHtml = document.documentElement.style.overflow;
    const prevBody = document.body.style.overflow;
    document.documentElement.style.overflow = "hidden";
    document.body.style.overflow = "hidden";
    return () => { document.documentElement.style.overflow = prevHtml; document.body.style.overflow = prevBody; };
  }, []);

  // Görünüm değişince en üste kaydır
  useEffect(() => {
    const el = document.getElementById("kz-app");
    if (el) el.scrollTo({ top:0 });
  }, [view.name, view.id]);

  // Arama yazılınca listeye dön
  useEffect(() => { if (query && view.name !== "list") setView({ name:"list" }); }, [query]);

  const askName = () => {
    let n = getUsername();
    if (n) return n;
    n = (window.prompt("Cevap/soru için görünecek adın:", "") || "").trim().slice(0, 24);
    if (!n) return null;
    saveUsername(n);
    return n;
  };

  const overall = useMemo(() => {
    const all = [];
    questions.forEach(q => q.answers.forEach(a => Object.values(a.raterIds || {}).forEach(v => all.push(v))));
    return { avg: all.length ? all.reduce((x,y)=>x+y,0)/all.length : 0, count: all.length };
  }, [questions]);

  const update = (id, fn) => setQuestions(qs => qs.map(q => q.id === id ? fn(q) : q));

  const openQuestion = (id) => {
    update(id, q => ({ ...q, views: q.views + 1 }));
    setView({ name:"detail", id });
  };

  const toggleBookmark = (id) => {
    const has = bookmarks.includes(id);
    const next = has ? bookmarks.filter(b => b !== id) : [...bookmarks, id];
    setBookmarks(next); saveBookmarks(next);
    update(id, q => ({ ...q, bookmarks: Math.max(0, q.bookmarks + (has ? -1 : 1)) }));
  };

  const rate = (qid, aid, n) => update(qid, q => ({
    ...q, answers: q.answers.map(a => a.id === aid ? { ...a, raterIds:{ ...a.raterIds, [myUid]: n } } : a),
  }));

  const addAnswer = (qid, body, source) => {
    const name = askName(); if (!name) return;
    update(qid, q => ({ ...q, answers:[...q.answers, { id:"a-" + uid(), user:name, date:todayStr(), body, source, raterIds:{}, owner:myUid }] }));
  };

  const deleteAnswer = (qid, aid) => {
    if (!window.confirm("Cevabın silinsin mi?")) return;
    update(qid, q => ({ ...q, answers: q.answers.filter(a => a.id !== aid) }));
  };

  const addQuestion = (data) => {
    const name = askName(); if (!name) return;
    const id = "q-" + uid();
    setQuestions(qs => [{ id, ...data, user:name, date:todayStr(), views:0, bookmarks:0, answers:[], owner:myUid }, ...qs]);
    setCategory("Tümü"); setSort("new"); setQuery("");
    setView({ name:"detail", id });
  };

  const deleteQuestion = (id) => {
    if (!window.confirm("Sorun silinsin mi?")) return;
    setQuestions(qs => qs.filter(q => q.id !== id));
    setView({ name:"list" });
  };

  const goHome = () => { window.location.href = "/"; };
  const current = view.name === "detail" ? questions.find(q => q.id === view.id) : null;

  return (
    <div style={{ position:"relative", zIndex:1, minHeight:"100%", display:"flex", flexDirection:"column" }}>
      <Header query={query} setQuery={setQuery} onAsk={() => setView({ name:"ask" })} onHome={goHome}
        goList={() => { setQuery(""); setView({ name:"list" }); }}
        overallAvg={overall.avg} overallCount={overall.count} />

      <main style={{ flex:1, width:"100%", maxWidth:860, margin:"0 auto", padding:"20px 16px 40px" }}>
        {view.name === "list" && (
          <ListView questions={questions} category={category} setCategory={setCategory} sort={sort} setSort={setSort}
            query={query} bookmarks={bookmarks} onOpen={openQuestion} />
        )}
        {view.name === "detail" && current && (
          <DetailView q={current} myUid={myUid} bookmarked={bookmarks.includes(current.id)}
            onBack={() => setView({ name:"list" })}
            onToggleBookmark={() => toggleBookmark(current.id)}
            onRate={(aid, n) => rate(current.id, aid, n)}
            onAnswer={(body, source) => addAnswer(current.id, body, source)}
            onDeleteAnswer={aid => deleteAnswer(current.id, aid)}
            onDeleteQuestion={() => deleteQuestion(current.id)} />
        )}
        {view.name === "ask" && <AskView onCancel={() => setView({ name:"list" })} onSubmit={addQuestion} />}
      </main>

      <footer style={{ textAlign:"center", color:T.mutedDim, fontSize:12.5, padding:"18px 16px 28px", borderTop:"1px solid " + T.border }}>
        Kozmik Zihin — meraktan bilgiye, birlikte.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
