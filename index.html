/* ================= Yardımcı fonksiyonlar ================= */
function avgRatings(raterIds) {
  const vals = Object.values(raterIds || {});
  if (!vals.length) return 0;
  return vals.reduce((a,b)=>a+b,0) / vals.length;
}
function countRatings(raterIds) { return Object.keys(raterIds || {}).length; }
function bestAnswerId(q) {
  let best = null, bestAvg = 0;
  q.answers.forEach(a => {
    const n = countRatings(a.raterIds), avg = avgRatings(a.raterIds);
    if (n >= 3 && avg >= 4.5 && avg > bestAvg) { best = a.id; bestAvg = avg; }
  });
  return best;
}
function bestAnswerAvg(q) {
  return q.answers.reduce((max,a) => Math.max(max, avgRatings(a.raterIds)), 0);
}
function fmt(n) { return n.toLocaleString("tr-TR"); }
function timeAgo(dateStr) {
  const d = new Date(dateStr);
  const days = Math.max(0, Math.round((Date.now() - d.getTime()) / 86400000));
  if (days === 0) return "bugün";
  if (days === 1) return "dün";
  if (days < 30) return days + " gün önce";
  if (days < 365) return Math.round(days/30) + " ay önce";
  return Math.round(days/365) + " yıl önce";
}
function todayStr() { return new Date().toISOString().slice(0,10); }

function MathText({ text, style, className, block }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.renderMathInElement) {
      window.renderMathInElement(ref.current, {
        delimiters: [{ left:"$$", right:"$$", display:true }, { left:"$", right:"$", display:false }],
        throwOnError: false,
      });
    }
  }, [text]);
