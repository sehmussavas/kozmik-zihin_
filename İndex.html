/* ================= Yardımcı fonksiyonlar ================= */
function avgRatings(raterIds) {
  const vals = Object.values(raterIds || {});
  if (!vals.length) return 0;
  return vals.reduce((a,b)=>a+b,0) / vals.length;
}
function bestAnswerAvg(q) {
  if (!q.answers.length) return 0;
  const best = q.answers.reduce((max,a) => Math.max(max, avgRatings(a.raterIds)), 0);
  return best;
}
function fmt(n) { return n.toLocaleString("tr-TR"); }
function timeAgo(dateStr) {
  const d = new Date(dateStr);
  const now = new Date("2026-08-30");
  const days = Math.max(0, Math.round((now - d) / 86400000));
  if (days === 0) return "bugün";
  if (days === 1) return "dün";
  if (days < 30) return days + " gün önce";
  return Math.round(days/30) + " ay önce";
}
function uid() {
  return "u-" + Math.random().toString(36).slice(2,10);
}

/* ================= Matematik destekli metin ================= */
function MathText({ text, style, className }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.renderMathInElement) {
      window.renderMathInElement(ref.current, {
        delimiters: [{ left:"$$", right:"$$", display:true }, { left:"$", right:"$", display:false }],
        throwOnError: false,
      });
    }
  }, [text]);
  return <span ref={ref} className={className} style={style}>{text}</span>;
}

/* ================= Küçük bileşenler ================= */
function CategoryIcon({ name, size = 14, style }) {
  const found = CATEGORIES.find(c => c.name === name);
  const Icon = found ? found.icon : Sparkles;
  return <Icon size={size} strokeWidth={2} style={style} />;
}

function BadgeChip({ name, size = "sm" }) {
  const style = BADGE_STYLES[name] || { color: T.purple };
  const pad = size === "sm" ? "2px 9px" : "4px 12px";
  const fs = size === "sm" ? 11 : 12.5;
  return (
    <span className="kz-body" style={{
      display:"inline-flex", alignItems:"center", gap:4, padding:pad, borderRadius:999,
      fontSize:fs, fontWeight:600, color:style.color, background: style.color + "1a",
      border: "1px solid " + style.color + "45", whiteSpace:"nowrap",
    }}>
      <Award size={fs} /> {name}
    </span>
  );
}

function CosmicRing({ average = 0, size = 48, count }) {
  const pct = Math.max(0, Math.min(5, average)) / 5;
  const r = (size - 7) / 2, c = 2 * Math.PI * r, dash = c * pct;
  const gid = "kzGrad" + size + Math.round(average*10);
  return (
    <div style={{ position:"relative", width:size, height:size, flexShrink:0 }}
      title={count ? (average.toFixed(1) + " / 5 (" + count + " değerlendirme)") : "Henüz değerlendirme yok"}>
      <svg width={size} height={size} style={{ transform:"rotate(-90deg)" }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="3.5" />
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={"url(#" + gid + ")"} strokeWidth="3.5" strokeLinecap="round"
          strokeDasharray={dash + " " + (c - dash)} style={{ transition:"stroke-dasharray 0.6s ease" }} />
        <defs><linearGradient id={gid} x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stopColor={T.purple} /><stop offset="100%" stopColor={T.gold} />
        </linearGradient></defs>
      </svg>
      <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center" }}>
        <span className="kz-display" style={{ fontSize:size*0.3, fontWeight:700, color:T.text, lineHeight:1 }}>
          {average > 0 ? average.toFixed(1) : "—"}
        </span>
      </div>
    </div>
  );
}

function StarRow({ value = 0, onRate, disabled, size = 18 }) {
  const [hover, setHover] = useState(0);
  const display = hover || value;
  return (
    <div style={{ display:"inline-flex", gap:3 }} onMouseLeave={() => setHover(0)}>
      {[1,2,3,4,5].map(n => (
        <span key={n}
          onMouseEnter={() => !disabled && setHover(n)}
          onClick={() => !disabled && onRate && onRate(n)}
          style={{ cursor: disabled ? "default" : "pointer", color: n <= display ? T.gold : "rgba(255,255,255,0.16)", transition:"color 0.15s" }}>
          <Star size={size} strokeWidth={0} style={{ fill: n <= display ? T.gold : "rgba(255,255,255,0.16)" }} />
        </span>
      ))}
    </div>
  );
}

const lbl = { display:"block", fontSize:12, fontWeight:600, color:T.mutedDim, margin:"14px 0 6px" };
const inp = { width:"100%", background:"rgba(255,255,255,0.03)", border:"1px solid " + T.border, borderRadius:10, color:T.text, padding:"9px 12px", fontSize:13.5, outline:"none" };

/* ================= Ana uygulama ================= */
function App() {
  const [questions, setQuestions] = useState(loadQuestions);
  const [query, setQuery] = useState("");
  const [category, setCategory] = useState("Tümü");
  const [sort, setSort] = useState("popular");
  const [openId, setOpenId] = useState(null);
  const [showAsk, setShowAsk] = useState(false);
  const [username, setUsername] = useState(() => localStorage.getItem(LS_USERNAME) || "");
  const [bookmarks, setBookmarks] = useState(getBookmarks);
  const myUid = useMemo(getUid, []);

  useEffect(() => saveQuestions(questions), [questions]);
  useEffect(() => { if (username) localStorage.setItem(LS_USERNAME, username); }, [username]);
  useEffect(() => saveBookmarks(bookmarks), [bookmarks]);

  useEffect(() => {
    if (openId) {
      const seen = JSON.parse(sessionStorage.getItem("kz_viewed") || "[]");
      if (!seen.includes(openId)) {
        seen.push(openId);
        sessionStorage.setItem("kz_viewed", JSON.stringify(seen));
        setQuestions(qs => qs.map(q => q.id === openId ? { ...q, views: q.views + 1 } : q));
      }
    }
  }, [openId]);

  const filtered = useMemo(() => {
    let list = questions.filter(q => {
      if (category !== "Tümü" && q.category !== category) return false;
      if (query.trim()) {
        const s = (q.title + " " + q.body + " " + q.tags.join(" ")).toLowerCase();
        if (!s.includes(query.toLowerCase())) return false;
      }
      return true;
    });
    const score = q => q.views + q.answers.length * 10 + q.bookmarks * 5;
    switch (sort) {
      case "star": list = [...list].sort((a,b) => bestAnswerAvg(b) - bestAnswerAvg(a)); break;
      case "popular": list = [...list].sort((a,b) => score(b) - score(a)); break;
      case "new": list = [...list].sort((a,b) => new Date(b.date) - new Date(a.date)); break;
      case "views": list = [...list].sort((a,b) => b.views - a.views); break;
      case "answers": list = [...list].sort((a,b) => b.answers.length - a.answers.length); break;
      case "solved": list = [...list].sort((a,b) => (b.answers.some(x=>x.best)?1:0) - (a.answers.some(x=>x.best)?1:0)); break;
    }
    return list;
  }, [questions, query, category, sort]);

  function addQuestion({ title, body, category, tags, user }) {
    const q = {
      id:"q-" + Date.now(), title, body, category, tags, user,
      date: new Date().toISOString().slice(0,10), views:0, bookmarks:0, answers:[],
    };
    setQuestions(qs => [q, ...qs]);
    setShowAsk(false);
    setOpenId(q.id);
  }

  function addAnswer(qId, body, source) {
    if (!username) { setShowAsk(true); return; }
    setQuestions(qs => qs.map(q => q.id === qId ? {
      ...q, answers:[...q.answers, { id:"a-"+Date.now(), user:username, date:new Date().toISOString().slice(0,10), edited:false, body, source, raterIds:{}, best:false }],
    } : q));
  }

  function rateAnswer(qId, aId, value) {
    setQuestions(qs => qs.map(q => q.id !== qId ? q : {
      ...q, answers: q.answers.map(a => a.id !== aId ? a : { ...a, raterIds:{ ...a.raterIds, [myUid]: value } }),
    }));
  }

  function markBest(qId, aId) {
    setQuestions(qs => qs.map(q => q.id !== qId ? q : {
      ...q, answers: q.answers.map(a => ({ ...a, best: a.id === aId })),
    }));
  }

  function toggleBookmark(qId) {
    setBookmarks(bm => {
      const has = bm.includes(qId);
      setQuestions(qs => qs.map(q => q.id === qId ? { ...q, bookmarks: q.bookmarks + (has ? -1 : 1) } : q));
      return has ? bm.filter(id => id !== qId) : [...bm, qId];
    });
  }

  const openQuestion = openId ? questions.find(q => q.id === openId) : null;

  return (
    <div style={{ position:"relative", zIndex:1, minHeight:"100vh" }}>
      <header style={{ position:"sticky", top:0, zIndex:10, background:"rgba(10,14,39,0.88)", backdropFilter:"blur(10px)", borderBottom:"1px solid " + T.border }}>
        <div style={{ maxWidth:1040, margin:"0 auto", padding:"16px 20px", display:"flex", alignItems:"center", gap:18, flexWrap:"wrap" }}>
          <div onClick={() => setOpenId(null)} style={{ display:"flex", alignItems:"center", gap:9, cursor:"pointer" }}>
            <CosmicRing average={4.6} size={34} count={1} />
            <span className="kz-display" style={{ fontSize:19, fontWeight:700, letterSpacing:0.2 }}>Kozmik Zihin</span>
          </div>
          <div style={{ flex:1, minWidth:180, position:"relative" }}>
            <Search size={16} style={{ position:"absolute", left:12, top:"50%", transform:"translateY(-50%)", color:T.mutedDim }} />
            <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Soru, konu veya etiket ara..."
              style={{
                width:"100%", background:"rgba(255,255,255,0.05)", border:"1px solid " + T.border, borderRadius:999,
                color:T.text, padding:"9px 14px 9px 36px", fontSize:13.5, outline:"none",
              }} />
          </div>
          <button onClick={() => setShowAsk(true)} style={{
            display:"inline-flex", alignItems:"center", gap:7, background:T.purple, color:"#0a0e27",
            fontWeight:700, fontSize:13.5, border:"none", borderRadius:999, padding:"9px 18px", whiteSpace:"nowrap",
          }}>
            <Plus size={16} /> Soru Sor
          </button>
        </div>
      </header>

      <main style={{ maxWidth:1040, margin:"0 auto", padding:"26px 20px 60px" }}>
        {openQuestion ? (
          <QuestionDetail q={openQuestion} myUid={myUid} username={username}
            bookmarked={bookmarks.includes(openQuestion.id)}
            onBack={() => setOpenId(null)}
            onToggleBookmark={toggleBookmark}
            onAddAnswer={addAnswer}
            onRateAnswer={rateAnswer}
            onMarkBest={markBest} />
        ) : (
          <React.Fragment>
            <div style={{ marginBottom:8 }}>
              <h1 className="kz-display" style={{ fontSize:24, fontWeight:700, margin:"0 0 4px" }}>Merak ettiğin her şey, kanıta dayalı cevaplarla.</h1>
              <p className="kz-body" style={{ margin:0, color:T.muted, fontSize:14 }}>Astrofizikten yapay zekaya, uzmanların ve meraklıların bir araya geldiği bilim topluluğu.</p>
            </div>

            <div className="kz-scroll-x" style={{ margin:"18px 0 12px" }}>
              {["Tümü", ...CATEGORIES.map(c=>c.name)].map(name => (
                <button key={name} onClick={() => setCategory(name)} style={{
                  flexShrink:0, display:"inline-flex", alignItems:"center", gap:6, fontSize:12.5, fontWeight:600,
                  padding:"7px 13px", borderRadius:999, whiteSpace:"nowrap",
                  border:"1px solid " + (category===name ? T.borderHover : T.border),
                  background: category===name ? "rgba(157,124,245,0.16)" : "transparent",
                  color: category===name ? T.purple : T.muted,
                }}>
                  {name !== "Tümü" && <CategoryIcon name={name} size={13} />} {name}
                </button>
              ))}
            </div>

            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16, flexWrap:"wrap", gap:10 }}>
              <span style={{ fontSize:12.5, color:T.mutedDim }}>{filtered.length} soru bulundu</span>
              <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                <Filter size={13} style={{ color:T.mutedDim }} />
                <select value={sort} onChange={e=>setSort(e.target.value)} style={{
                  background:"rgba(255,255,255,0.04)", border:"1px solid " + T.border, color:T.text,
                  borderRadius:8, fontSize:12.5, padding:"6px 10px", outline:"none",
                }}>
                  {SORTS.map(s => <option key={s.key} value={s.key}>{s.label}</option>)}
                </select>
              </div>
            </div>

            <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
              {filtered.map(q => (
                <QuestionCard key={q.id} q={q} onOpen={setOpenId} bookmarked={bookmarks.includes(q.id)} />
              ))}
              {filtered.length === 0 && (
                <div style={{ textAlign:"center", padding:"50px 0", color:T.mutedDim }}>Aramanla eşleşen bir soru bulunamadı.</div>
              )}
            </div>
          </React.Fragment>
        )}
      </main>

      <footer style={{ borderTop:"1px solid " + T.border, padding:"20px", textAlign:"center", color:T.mutedDim, fontSize:12 }}>
        Kozmik Zihin — meraktan bilgiye, birlikte.
      </footer>

      {showAsk && <AskModal onClose={() => setShowAsk(false)} onSubmit={addQuestion} username={username} setUsername={setUsername} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
